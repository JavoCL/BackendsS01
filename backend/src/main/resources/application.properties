spring.application.name=backend

#Puerto del servidor backend
server.port=4040

#Conexion a base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/telovendo_db
spring.datasource.username=postgres_admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

#Configuracion de JPA (crea y actualiza las tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true