services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: admin123
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: